name: Android Kernel Tear Builder

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
      driver_name:
        description: 'Driver Module Name (e.g., mydriver.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64, etc.)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker rmi $(docker image ls -aq) 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        
      - name: Prepare kerneldriver directory
        run: |
          mkdir kerneldriver
          mv ./code/*.h ./code/*.c ./code/Makefile kerneldriver/
          
      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3 libc6-dev libncurses-dev rsync

      - name: Set up Android Kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync
          find . -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo
          echo "=== After repo sync cleanup ==="
          df -h

      - name: Copy kerneldriver
        run: |
          cd android-kernel
          cp -r ../kerneldriver common/drivers

      - name: Modify Makefile
        run: |
          cd android-kernel
          echo "obj-y += kerneldriver/" >> common/drivers/Makefile

      - name: Prepare module list for legacy builds
        if: ${{ github.event.inputs.android_version <= 13 }}
        run: |
          cd android-kernel
          echo "drivers/kerneldriver/${{ github.event.inputs.driver_name }}" >> common/android/gki_${{ github.event.inputs.target_arch }}_modules

      - name: Add module to GKI modules list
        if: ${{ github.event.inputs.android_version > 13 }}
        run: |
          cd android-kernel
          MODULE_NAME="drivers/kerneldriver/${{ github.event.inputs.driver_name }}"
          awk -i inplace -v module="$MODULE_NAME" '
            BEGIN { added=0 }
            /_COMMON_GKI_MODULES_LIST = \[/ { in_list=1 }
            in_list && /\]/ {
              if (!added) { print "    \"" module "\"," ; added=1 }
              in_list=0
            }
            in_list && !added {
              if (module < $0) { print "    \"" module "\"," ; added=1 }
            }
            { print }
          ' common/modules.bzl

      - name: Increase stack frame size limit
        run: |
          cd android-kernel
          find . -type f -name "Makefile*" -exec sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' {} +
          grep -q "FRAME_WARN" common/Makefile || echo 'KBUILD_CFLAGS += -Wframe-larger-than=4096' >> common/Makefile

      - name: Disable HDRTEST
        run: |
          cd android-kernel
          python3 << 'PYEOF'
          import glob
          for filepath in glob.glob('common/usr/include/Makefile'):
              with open(filepath, 'r') as fp:
                  lines = fp.read().splitlines()
              result = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  full_stmt = line
                  j = i
                  while j < len(lines) and lines[j].endswith('\\'):
                      j += 1
                      if j < len(lines):
                          full_stmt += '\n' + lines[j]
                  if 'hdrtest' in full_stmt:
                      i = j + 1
                  else:
                      result.append(line)
                      i += 1
              with open(filepath, 'w') as fp:
                  fp.write('\n'.join(result) + '\n')
          print("HDRTEST disabled successfully")
          PYEOF

      - name: Build kernel module
        run: |
          cd android-kernel
          if [ ${{ github.event.inputs.android_version }} -le 13 ]; then
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} \
            LTO=thin \
            KMI_SYMBOL_LIST_STRICT_MODE=0 \
            build/build.sh -j32
            echo "OUTPUT_PATH=out/android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}/dist" >> $GITHUB_ENV
          else
            tools/bazel run //common:kernel_${{ github.event.inputs.target_arch }}_dist
            echo "OUTPUT_PATH=out/kernel_${{ github.event.inputs.target_arch }}" >> $GITHUB_ENV
          fi

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          if [ -z "${{ env.OUTPUT_PATH }}" ]; then
            echo "OUTPUT_PATH not set, build likely failed"
            exit 1
          fi
          cd android-kernel/${{ env.OUTPUT_PATH }}
          if [ -f "${{ github.event.inputs.driver_name }}" ]; then
            cp -v "${{ github.event.inputs.driver_name }}" ../../../artifacts/
          fi
          for ko in *.ko; do
            if [ -f "$ko" ]; then
              size=$(stat -c%s "$ko" 2>/dev/null || echo 0)
              if [ "$size" -lt 52428800 ]; then
                cp -v "$ko" ../../../artifacts/ 2>/dev/null || true
              fi
            fi
          done
          echo "=== Artifacts to upload ==="
          ls -lh ../../../artifacts/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: artifacts/
