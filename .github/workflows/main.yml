name: Android Kernel Tear Builder

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 12)'
        required: true
      kernel_version:
        description: 'Kernel Version (e.g., 5.4)'
        required: true
      driver_name:
        description: 'Driver Module Name (e.g., rwProcMem_module.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64, etc.)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker rmi $(docker image ls -aq) 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Prepare kerneldriver directory
        run: |
          mkdir kerneldriver
          mv ./code/*.h ./code/*.c ./code/Makefile kerneldriver/

      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Install dependencies
        run: |
           sudo apt-get update
           sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3 lld clang llvm binutils-aarch64-linux-gnu

      - name: Set up Android Kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync
          find . -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo

      - name: Copy kerneldriver
        run: |
          cd android-kernel
          cp -r ../kerneldriver common/drivers

      - name: Copy device config file
        run: |
          if [ -f ./config ]; then
            cp ./config android-kernel/common/.config
            echo "✓ Device config file copied successfully"
          else
            echo "✗ Warning: config file not found in repository root"
            exit 1
          fi

      - name: Override kernel version for 5.4 target
        run: |
          cd android-kernel/common
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
          sed -i '/^EXTRAVERSION\s*=/s/=.*/= /' Makefile

      - name: Setup out-of-tree driver Makefile for 5.4
        run: |
          cd kerneldriver
          MOD="${{ github.event.inputs.driver_name }}"
          BASE="${MOD%.ko}"
          echo "obj-m := ${BASE}.o" > Makefile

      - name: Prepare kernel configuration
        env:
            ARCH: arm64
            CROSS_COMPILE: aarch64-linux-gnu-
            CC: clang
            AS: aarch64-linux-gnu-as
        run: |
            cd android-kernel/common
            make LLVM=1 olddefconfig

      - name: Build kernel modules preparation
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: clang
        run: |
          cd android-kernel/common
          make LLVM=1 modules_prepare

      - name: Build driver module
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: clang
        run: |
          cd android-kernel/common
          make LLVM=1 M=$GITHUB_WORKSPACE/kerneldriver modules

      - name: Verify and copy driver artifact
        run: |
          if [ -f "$GITHUB_WORKSPACE/kerneldriver/${{ github.event.inputs.driver_name }}" ]; then
            mkdir -p $GITHUB_WORKSPACE/artifacts
            cp $GITHUB_WORKSPACE/kerneldriver/${{ github.event.inputs.driver_name }} $GITHUB_WORKSPACE/artifacts/
            echo "✓ Driver build successful: ${{ github.event.inputs.driver_name }}"
          else
            echo "✗ Error: Driver file not found"
            find $GITHUB_WORKSPACE/kerneldriver -name "*.ko" -o -name "*.o"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: artifacts/
