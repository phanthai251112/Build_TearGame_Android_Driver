name: Build TearGame Kernel Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt công cụ (Clang 11, repo)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 \
                                  clang-11 lld-11 llvm-11
          sudo curl -Lo /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-11 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-11 100

      - name: Tải kernel source Android 12-5.4
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4
          repo sync -j$(nproc) -c --no-tags --force-sync
          rm -rf .repo

      - name: Sửa vermagic cho máy của bạn
        run: |
          cd android-kernel/common
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
          echo -n '-qgki-gcc3ec22f5061' > localversion

      - name: Chuẩn bị driver TearGame và config máy
        run: |
          # Clone driver TearGame
          cd android-kernel
          git clone https://github.com/tearhacker/TearGame_KernelDriver_Android_WriteReadMemory.git temp_driver
          mkdir -p drivers/teargame
          cp temp_driver/DEV旧版驱动/内核驱动读写LINUX源码JiangNgihtDriverByTear/* drivers/teargame/

          # Tạo Makefile cho out-of-tree build
          cd drivers/teargame
          echo 'obj-m := teargame.o' > Makefile
          echo 'teargame-objs := entry.o memory.o process.o' >> Makefile
          echo 'ccflags-y := -I$(src)/.' >> Makefile

      - name: Build module với config của bạn
        run: |
          cp config android-kernel/common/.config
          cd android-kernel/common
          # Tắt LSE để tránh lỗi assembly
          scripts/config --disable ARM64_LSE_ATOMICS
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 modules_prepare
          # Build driver out-of-tree (chỉ build module, không build kernel)
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 M=drivers/teargame modules
          # Copy file .ko ra artifact
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp drivers/teargame/*.ko $GITHUB_WORKSPACE/artifacts/

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: TearGame-driver
          path: artifacts/
