name: Build TearGame Kernel Driver
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 python-is-python3 lld git curl gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cai repo tool
        run: |
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Cau hinh git
        run: |
          git config --global user.email "ci@build.local"
          git config --global user.name "CI Build"

      - name: Tai kernel source Android 12-5.4
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4
          repo sync -j$(nproc) -c --no-tags --force-sync
          rm -rf .repo

      - name: Sua vermagic
        run: |
          cd android-kernel/common
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
          echo -n '-qgki-gcc3ec22f5061' > localversion

      - name: Patch kgdb bug
        run: |
          sed -i 's/asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM));/asm ("brk #0x401");/' android-kernel/common/arch/arm64/include/asm/kgdb.h

      - name: Copy driver TearGame vao kernel
        run: |
          git clone https://github.com/tearhacker/TearGame_KernelDriver_Android_WriteReadMemory.git temp_driver
          echo "=== CAU TRUC REPO ==="
          find temp_driver -type f
          mkdir -p android-kernel/common/drivers/teargame
          find temp_driver -name "*.c" > /tmp/filelist.txt
          find temp_driver -name "*.h" >> /tmp/filelist.txt
          find temp_driver -name "Makefile" >> /tmp/filelist.txt
          cat /tmp/filelist.txt | xargs -I F cp F android-kernel/common/drivers/teargame/
          echo "=== FILE DA COPY ==="
          ls -la android-kernel/common/drivers/teargame/
          echo "=== NOI DUNG MAKEFILE DRIVER ==="
          cat android-kernel/common/drivers/teargame/Makefile || echo "KHONG CO MAKEFILE"
          echo "obj-m += teargame/" >> android-kernel/common/drivers/Makefile
          echo "=== KIEM TRA DRIVERS/MAKEFILE ==="
          tail -5 android-kernel/common/drivers/Makefile

      - name: Build kernel modules
        run: |
          cd android-kernel/common
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          scripts/config --disable KGDB
          scripts/config --disable KGDB_KDB
          scripts/config --disable ARM64_LSE_ATOMICS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules 2>&1 | tail -50
          echo "=== TIM .KO ==="
          find . -name "*.ko" || echo "KHONG CO .KO"
          mkdir -p $GITHUB_WORKSPACE/artifacts
          find . -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \;
          ls -la $GITHUB_WORKSPACE/artifacts/

      - name: Upload file ko
        uses: actions/upload-artifact@v4
        with:
          name: TearGame-driver
          path: artifacts/
