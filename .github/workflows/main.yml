name: Build TearGame Kernel Driver
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 python-is-python3 git curl gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang-11 lld-11 llvm-11
          sudo ln -sf /usr/bin/clang-11 /usr/bin/clang
          sudo ln -sf /usr/bin/lld-11 /usr/bin/lld

      - name: Cai repo tool
        run: |
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Cau hinh git
        run: |
          git config --global user.email "ci@build.local"
          git config --global user.name "CI Build"

      - name: Tai kernel source Android 12-5.4
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.4
          repo sync -j$(nproc) -c --no-tags --force-sync
          rm -rf .repo

      - name: Sua vermagic va copy config may that
        run: |
          cd android-kernel/common
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
          echo -n '-qgki-gcc3ec22f5061' > localversion
          cp $GITHUB_WORKSPACE/config .config

      - name: Patch kgdb bug
        run: |
          sed -i 's/asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM));/asm ("brk #0x401");/' android-kernel/common/arch/arm64/include/asm/kgdb.h

      - name: Clone va chuan bi driver
        run: |
          git clone https://github.com/tearhacker/TearGame_KernelDriver_Android_WriteReadMemory.git temp_driver
          mkdir -p $GITHUB_WORKSPACE/teargame_module
          find temp_driver -name "*.c" -exec cp {} $GITHUB_WORKSPACE/teargame_module/ \;
          find temp_driver -name "*.h" -exec cp {} $GITHUB_WORKSPACE/teargame_module/ \;
          OBJ=$(find $GITHUB_WORKSPACE/teargame_module -name "*.c" -exec basename {} .c \; | awk '{printf "obj-m += %s.o\n", $1}')
          echo "$OBJ" > $GITHUB_WORKSPACE/teargame_module/Makefile
          echo "=== MAKEFILE ==="
          cat $GITHUB_WORKSPACE/teargame_module/Makefile

      - name: Build kernel modules
        run: |
          cd android-kernel/common
          scripts/config --disable KGDB
          scripts/config --disable KGDB_KDB
          scripts/config --disable ARM64_LSE_ATOMICS
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-11 LD=ld.lld-11 AR=llvm-ar-11 NM=llvm-nm-11 \
            OBJCOPY=llvm-objcopy-11 OBJDUMP=llvm-objdump-11 \
            STRIP=llvm-strip-11 LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-11 LD=ld.lld-11 AR=llvm-ar-11 NM=llvm-nm-11 \
            OBJCOPY=llvm-objcopy-11 OBJDUMP=llvm-objdump-11 \
            STRIP=llvm-strip-11 LLVM=1 LLVM_IAS=1 -j$(nproc) modules_prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-11 LD=ld.lld-11 AR=llvm-ar-11 NM=llvm-nm-11 \
            OBJCOPY=llvm-objcopy-11 OBJDUMP=llvm-objdump-11 \
            STRIP=llvm-strip-11 LLVM=1 LLVM_IAS=1 \
            M=$GITHUB_WORKSPACE/teargame_module -j$(nproc) modules
          mkdir -p $GITHUB_WORKSPACE/artifacts
          find $GITHUB_WORKSPACE/teargame_module -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \;
          ls -la $GITHUB_WORKSPACE/artifacts/

      - name: Upload file ko
        uses: actions/upload-artifact@v4
        with:
          name: TearGame-driver
          path: artifacts/
